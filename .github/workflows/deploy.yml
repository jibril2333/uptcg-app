name: Deploy UPTCG to local Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never add pull_request here. A self-hosted runner executes workflow code on
# this Mac, so untrusted pull requests must not be allowed to trigger it.
concurrency:
  group: deploy-uptcg-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy on uptcg-mac-mini
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - uptcg
    timeout-minutes: 60

    env:
      UPTCG_DATA_DIR: /Users/rei/Library/Application Support/UPTCG/data
      UPTCG_GID: "20"
      UPTCG_IMAGE: uptcg-app:prod
      UPTCG_PORT: "3002"
      UPTCG_UID: "501"

    steps:
      - name: Add host tools to PATH
        run: |
          echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1
          lfs: true

      - name: Build and deploy
        run: bash scripts/deploy-local.sh
